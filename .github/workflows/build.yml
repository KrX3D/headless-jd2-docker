name: Build and Test

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - '.github/dependabot.yml'
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: debian.Dockerfile
          push: false
          tags: jd2:debian
          load: true

      - name: Build Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: alpine.Dockerfile
          push: false
          tags: jd2:alpine
          load: true

      - name: DEBUG image state
        run: |
          for image in debian alpine; do
            echo "=== $image: os-release ==="
            docker run --rm jd2:$image cat /etc/os-release || true
            echo "=== $image: passwd ==="
            docker run --rm jd2:$image getent passwd || true
            echo "=== $image: group (gid 100/101) ==="
            docker run --rm jd2:$image sh -c 'getent group 100; getent group 101' || true
            echo "=== $image: useradd presence ==="
            docker run --rm jd2:$image sh -c 'command -v useradd; command -v groupadd; command -v getent; command -v id' || true
            echo "=== $image: entrypoint dry run output ==="
            timeout 10 docker run --rm --entrypoint sh jd2:$image -c 'sh -x /opt/JDownloader/entrypoint.sh true 2>&1 | head -n 60' || true
          done

      - name: Install goss/dgoss
        env:
          GOSS_VER: v0.4.10
        run: |
          curl -fsSL https://goss.rocks/install | sh
          curl -fsSL "https://github.com/goss-org/goss/releases/download/${GOSS_VER}/dgoss" -o /usr/local/bin/dgoss
          chmod +rx /usr/local/bin/dgoss

      - name: Test images with goss
        run: |
          set -e
          for image in debian alpine; do
            tag="jd2:${image}"

            echo "Testing $tag (default)"
            GOSS_FILES_PATH=./tests/default dgoss run "$tag"

            echo "Testing $tag with UID and GID"
            GOSS_FILES_PATH=./tests/uid-test dgoss run -e UID=1001 -e GID=101 "$tag"

            echo "Testing $tag with EMAIL and PASSWORD"
            GOSS_FILES_PATH=./tests/credentials-test dgoss run -e EMAIL=mymail@example.com -e PASSWORD=mypassword "$tag"
          done

  push:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials not configured — skipping push."
          fi

      - name: Set up Docker Buildx
        if: steps.creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.creds.outputs.configured == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/jdownloader2-headless
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        if: steps.creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: debian.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
